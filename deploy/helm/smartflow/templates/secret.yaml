{{/*
  The development JWT secret. Kubernetes Secrets are base64, not encryption, so
  this is here to keep the value out of the Deployment spec and out of `kubectl
  get deploy -o yaml` output - not to protect it. A real deployment sets
  auth0Domain/auth0Audience instead and never uses this path.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.devJwtSecretName }}
  labels:
    {{- include "smartflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  devJwtSecret: {{ .Values.auth.devJwtSecret | default "smartflow-dev-secret" | quote }}

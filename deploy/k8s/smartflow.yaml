apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  labels:
    app: redpanda
    app.kubernetes.io/part-of: smartflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
        app.kubernetes.io/part-of: smartflow
    spec:
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
        args:
        - redpanda
        - start
        - --overprovisioned
        - --smp=1
        - --memory=512M
        - --reserve-memory=0M
        - --node-id=0
        - --check=false
        - --kafka-addr=PLAINTEXT://0.0.0.0:9092
        - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
        ports:
        - name: kafka
          containerPort: 9092
        - name: admin
          containerPort: 9644
        readinessProbe:
          tcpSocket:
            port: kafka
          initialDelaySeconds: 10
          periodSeconds: 10
---

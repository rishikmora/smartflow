  - name: admin
    port: 9644
    targetPort: admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/part-of: smartflow
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\nscrape_configs:\n  - job_name:\
    \ smartflow-services\n    metrics_path: /metrics\n    static_configs:\n      -\
    \ targets:\n              - sim-service:8000\n              - rl-service:8000\n\
    \              - vision-service:8000\n              - graph-service:8000\n   \
    \           - llm-service:8000\n        labels:\n          project: smartflow\n\
    \  - job_name: redpanda\n    static_configs:\n      - targets: [\"redpanda:9644\"\
    ]\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
    app.kubernetes.io/part-of: smartflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/part-of: smartflow
    spec:
      containers:
      - name: prometheus

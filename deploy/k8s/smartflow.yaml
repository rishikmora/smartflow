# SmartFlow - Kubernetes manifests.
#
# GENERATED by deploy/render_manifests.py from deploy/helm/smartflow/values.yaml.
# Edit the values, not this file. The Helm chart and these manifests describe
# the same deployment; this exists so the stack can be applied without Helm.
#
#   kubectl apply -f deploy/k8s/smartflow.yaml
#
# The data volume is a hostPath: on a single-node k3d cluster, mount the
# repository at values.data.hostPath, e.g.
#   k3d cluster create smartflow --volume /path/to/smartflow:/mnt/smartflow
---
apiVersion: v1
kind: Secret
metadata:
  name: smartflow-auth
  labels:
    app.kubernetes.io/part-of: smartflow
type: Opaque
stringData:
  devJwtSecret: smartflow-dev-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-service
  labels:
    app: sim-service
    app.kubernetes.io/part-of: smartflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim-service
  template:
    metadata:
      labels:
        app: sim-service
        app.kubernetes.io/part-of: smartflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: sim-service
        image: smartflow/sim_service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: SMARTFLOW_DATA_ROOT
          value: /data
        - name: SMARTFLOW_ENV
          value: development
        - name: SMARTFLOW_EVENT_TOPIC
          value: smartflow.events
        - name: AUTH0_DOMAIN
          value: ''
        - name: AUTH0_AUDIENCE
          value: ''
        - name: SMARTFLOW_DEV_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: smartflow-auth
              key: devJwtSecret
        - name: REDPANDA_BROKERS
          value: redpanda:9092
        volumeMounts:
        - name: project-data
          mountPath: /data
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: project-data
        hostPath:
          path: /mnt/smartflow
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: sim-service
  labels:
    app: sim-service
    app.kubernetes.io/part-of: smartflow
spec:
  type: NodePort
  selector:
    app: sim-service
  ports:
  - name: http
    port: 8000
    targetPort: http
    nodePort: 30001
